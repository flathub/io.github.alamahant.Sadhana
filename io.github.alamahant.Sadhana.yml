app-id: io.github.alamahant.Sadhana
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
# Needed because it provides QPdfView and related pdf functionality that the app uses.
base: io.qt.qtwebengine.BaseApp
base-version: '6.10' 
command: Sadhana
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

# Needed for playing mantra recitation and puja audio files
  - --socket=pulseaudio

# Need network access for RSS feed functionality
# Fetches teachings and events from:
# https://github.com/alamahant/Sadhana/blob/master/sadhana-feed.xml
  - --share=network

cleanup-commands:
  - /app/cleanup-BaseApp.sh
# Need only QtPdfWidgets. Cleaning up webengine
  - rm -rf ${FLATPAK_DEST}/include/QtWebEngine*
  - rm -rf ${FLATPAK_DEST}/lib/*WebEngine*
  - rm -rf ${FLATPAK_DEST}/lib/*-linux-gnu/*WebEngine*
  - rm -rf ${FLATPAK_DEST}/lib/qml/QtWebEngine*

modules:
  - name: Sadhana
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/alamahant/Sadhana.git
        tag: v1.0.2
        commit: b4f1eb37c107e1b938ff4dd8ab65e685b59bee72